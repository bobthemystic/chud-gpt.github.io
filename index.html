<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChudGPT</title>
    <link rel="stylesheet" href="styles.css">
   
</head>
<body>
    <h2>ChudGPT</h2>
    <div id="chat-container">
        <span id="thinking" hidden>thinking...</span>
    </div>
    <div id="input-container">
        <input type="text" id="prompt" placeholder="Type your message here...">
        <button id="send-button">Send</button>
    </div>
    <script>
       const sendButton = document.getElementById('send-button');
       const promptInput = document.getElementById('prompt'); 

       sendButton.addEventListener('click', () => {
           const message = promptInput.value;
           if (message.trim() !== '') {
               displayMessage(message, 'guy');
               fakeAi(message);
               promptInput.value = '';
           }
       });

       function fakeAi(prompt) {
            const thinkingElement = document.getElementById('thinking');
            thinkingElement.style.display = 'block';
            
            thinkTime = Math.floor(Math.random() * 2000) + 1000; // Random thinking time between 1-4 seconds
            choice = Math.floor(Math.random() * 8)+1; // Randomly choose between 0, 1, or 2
            aiResponse = '';
            
            if (choice == 1) {
                aiResponse = `sorry, I don't understand`;
            } 
            else if (choice == 2) {
                aiResponse = `i'm not sure about that.`;
            } 
            else if (choice == 3) {
                aiResponse = `that's an interesting question...`;
            }
            else if (choice == 4){
                aiResponse = `true!`
            }
            else if (choice == 5){
                aiResponse = `i dont belive that.`
            }
            else if (choice == 6){
                aiResponse = `ask better questions. dummy.`
            }
            else if (choice == 7){
                aiResponse = `this is true info!1!`
            }
            else if (choice == 8 ){
                aiResponse = `i do not think so..`
            }

            setTimeout(() => {
                displayMessage(aiResponse, 'ai');
                thinkingElement.style.display = 'none';
            }, thinkTime); // Simulate a 2-second delay for AI response

       }

       function displayMessage(message, sender) {
           const chatContainer = document.getElementById('chat-container');
           const messageElement = document.createElement('div');
           messageElement.classList.add('message', sender);
           messageElement.textContent = message;
           chatContainer.appendChild(messageElement);
           chatContainer.scrollTop = chatContainer.scrollHeight; // Scroll to the bottom
       }
    </script>
</body>
